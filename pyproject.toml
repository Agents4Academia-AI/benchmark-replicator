[project]
name = "benchmark-replicator"
version = "0.1.0"
description = "Turn an arXiv paper or any PDF into a clean, minimal, modular implementation using scoped Codex agents."
authors = [
    { name = "Sahel Iqbal", email = "sahel13miqbal@proton.me" },
    { name = "Arya Akhavan", email = "aryaakhavanf@gmail.com" },
    { name = "Olga Isupova", email = "ihoho89@gmail.com" },
]
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
keywords = [
    "llm",
    "agents",
    "research",
    "reproducibility",
    "arxiv",
    "paper",
    "code-generation",
]
dependencies = [
    "openai-codex>=0.144.4",
    "pymupdf>=1.24",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.urls]
Homepage = "https://github.com/Agents4Academia-AI/benchmark-replicator"
Repository = "https://github.com/Agents4Academia-AI/benchmark-replicator"
Issues = "https://github.com/Agents4Academia-AI/benchmark-replicator/issues"

[project.scripts]
replicate = "replicator.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["replicator"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]

# The formatter wraps code at line-length (100); let E501 only flag lines that
# can't be wrapped (long string literals / docstrings) past a looser bound.
[tool.ruff.lint.pycodestyle]
max-line-length = 120
