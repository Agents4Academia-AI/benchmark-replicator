[project]
name = "baseline-replicator"
version = "0.1.0"
description = "Turn an arXiv paper or any PDF into a clean, minimal, CPU-runnable baseline implementation using scoped Claude Agent SDK sub-agents."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "claude-agent-sdk>=0.2.101",
    "pymupdf>=1.24",
]

[project.scripts]
replicate = "replicator.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["replicator"]
