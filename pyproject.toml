[project]
name = "baseline-replicator"
version = "0.1.0"
description = "Turn an arXiv paper or any PDF into a clean, minimal, CPU-runnable baseline implementation using scoped Claude Agent SDK sub-agents."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "claude-agent-sdk>=0.2.101",
    "pymupdf>=1.24",
]

[project.scripts]
replicate = "replicator.cli:main"
replicator-web = "replicator.web:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["replicator"]

[dependency-groups]
dev = [
    "ruff>=0.15.19",
]

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]  # long lines in embedded HTML/CSS/JS strings are acceptable
