[project]
name = "baseline-replicator"
version = "0.1.0"
description = "Turn an arXiv paper or any PDF into a clean, minimal, CPU-runnable baseline implementation using scoped, provider-agnostic LLM sub-agents."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "langgraph>=1.0",
    "langchain>=1.0",
    "langchain-core>=1.0",
    "ddgs>=6.0",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "pymupdf>=1.24",
]

[project.optional-dependencies]
anthropic = ["langchain-anthropic>=0.3"]
openai = ["langchain-openai>=0.3"]
google = ["langchain-google-genai>=2.0"]
ollama = ["langchain-ollama>=0.2"]
all = [
    "langchain-anthropic>=0.3",
    "langchain-openai>=0.3",
    "langchain-google-genai>=2.0",
    "langchain-ollama>=0.2",
]

[project.scripts]
replicate = "replicator.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["replicator"]
